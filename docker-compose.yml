# docker compose up --build   ->  UI on http://localhost:8501, API on http://localhost:8000/docs
services:
  api:
    build: .
    env_file: .env            # needs GEMINI_API_KEY (or another provider's key + LLM_PROVIDER)
    ports: ["8000:8000"]
    volumes:
      - ./outputs:/app/outputs
      - ./uploads:/app/uploads
      - ./logs:/app/logs

  ui:
    build: .
    command: ["streamlit", "run", "ui/app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    environment:
      API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]
